<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Certificates DataTable</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap.min.css" />
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css">
</head>
<body>
    <div class="container-fluid p-4">
        <h1>Certificates DataTable Test</h1>
        
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">Test DataTable Initialization</h4>
            </div>
            <div class="card-body">
                <table id="certificates-table" class="table table-bordered dt-responsive nowrap table-striped align-middle" style="width:100%">
                    <thead class="table-light">
                        <tr>
                            <th>Award</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Recipients</th>
                            <th>Progress</th>
                            <th>Certificate Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Test Award 1</td>
                            <td>Excellence</td>
                            <td>Test description for excellence award</td>
                            <td class="text-center">5</td>
                            <td>
                                <div class="progress" style="height: 20px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: 80%;">
                                        4 / 5
                                    </div>
                                </div>
                            </td>
                            <td class="text-center"><span class="badge bg-success">Available</span></td>
                            <td class="text-center">
                                <div class="d-flex gap-2 justify-content-center">
                                    <button class="btn btn-sm btn-primary" title="View Details">
                                        <i class="ri-eye-fill"></i>
                                    </button>
                                    <button class="btn btn-sm btn-success" title="Manage Participants">
                                        <i class="ri-group-line"></i>
                                    </button>
                                    <button class="btn btn-sm btn-info" title="Issue Certificates">
                                        <i class="ri-award-line"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>Test Award 2</td>
                            <td>Participation</td>
                            <td>Test description for participation award</td>
                            <td class="text-center">3</td>
                            <td>
                                <div class="progress" style="height: 20px;">
                                    <div class="progress-bar bg-warning" role="progressbar" style="width: 33%;">
                                        1 / 3
                                    </div>
                                </div>
                            </td>
                            <td class="text-center"><span class="badge bg-warning">No Template</span></td>
                            <td class="text-center">
                                <div class="d-flex gap-2 justify-content-center">
                                    <button class="btn btn-sm btn-primary" title="View Details">
                                        <i class="ri-eye-fill"></i>
                                    </button>
                                    <button class="btn btn-sm btn-success" title="Manage Participants">
                                        <i class="ri-group-line"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
    
    <!-- RemixIcon CSS for icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded for certificates test");
            console.log("jQuery version:", jQuery.fn.jquery);
            
            // Check if table exists
            var tableElement = $('#certificates-table');
            console.log("Table found:", tableElement.length > 0);
            console.log("Table rows:", tableElement.find('tbody tr').length);
            
            try {
                // Initialize DataTable exactly like program payments
                var certificatesTable = $('#certificates-table').DataTable({
                    responsive: true,
                    lengthChange: false,
                    pageLength: 10,
                    searching: true,
                    ordering: true,
                    columnDefs: [{
                        orderable: false,
                        targets: [4, 5, 6] // Progress, Status, Actions columns are not sortable
                    }],
                    drawCallback: function() {
                        $(".dataTables_paginate > .pagination").addClass("pagination-squared justify-content-end mb-0");
                    }
                });
                
                console.log("DataTable initialized successfully");
                
                Swal.fire({
                    title: 'Success!',
                    text: 'DataTable initialized successfully with ' + certificatesTable.rows().count() + ' rows',
                    icon: 'success',
                    confirmButtonColor: '#0ab39c'
                });
                
            } catch (error) {
                console.error("Error initializing DataTable:", error);
                
                Swal.fire({
                    title: 'Error!',
                    text: 'Failed to initialize DataTable: ' + error.message,
                    icon: 'error',
                    confirmButtonColor: '#f06548'
                });
            }
        });
    </script>
</body>
</html>
