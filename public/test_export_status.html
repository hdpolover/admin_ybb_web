<!DOCTYPE html>
<html>
<head>
    <title>YBB Export Status Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>YBB Export Status Test</h2>
    <p>Export ID: <strong>5e3e2eb4-070a-4072-9b93-60abdf9c5d07</strong></p>
    
    <button id="testStatusBtn">Test Status Check</button>
    <button id="testDownloadBtn">Test Download</button>
    
    <div id="results" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        $('#testStatusBtn').click(function() {
            const exportId = '5e3e2eb4-070a-4072-9b93-60abdf9c5d07';
            
            console.log('Testing status check for export:', exportId);
            $('#results').html('<p>Checking status...</p>');
            
            $.ajax({
                url: `/admin/exports/status/${exportId}`,
                method: 'GET',
                dataType: 'json',
                timeout: 10000
            })
            .then(function(response) {
                console.log('Status response:', response);
                
                let html = '<h3>Status Response:</h3>';
                html += '<pre>' + JSON.stringify(response, null, 2) + '</pre>';
                
                if (response.downloadUrl) {
                    html += '<p><a href="' + response.downloadUrl + '" target="_blank">Download Link</a></p>';
                }
                
                $('#results').html(html);
            })
            .catch(function(error) {
                console.error('Status check error:', error);
                $('#results').html('<p style="color: red;">Error: ' + error.statusText + '</p>');
            });
        });
        
        $('#testDownloadBtn').click(function() {
            const exportId = '5e3e2eb4-070a-4072-9b93-60abdf9c5d07';
            const downloadUrl = `/admin/exports/download/${exportId}`;
            
            console.log('Testing download for export:', exportId);
            $('#results').html('<p>Initiating download...</p>');
            
            // Open in new window for download
            window.open(downloadUrl, '_blank');
        });
    </script>
</body>
</html>
