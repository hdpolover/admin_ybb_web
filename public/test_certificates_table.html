<!DOCTYPE html>
<html>
<head>
    <title>Certificate DataTable Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .test-section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>Certificate Management DataTable Test</h1>
        
        <div class="test-section">
            <h3>🔬 Testing AJAX Endpoint</h3>
            <button class="btn btn-primary" onclick="testAjaxEndpoint()">Test /documents/certificates/getData</button>
            <div id="ajax-result" class="mt-3"></div>
        </div>
        
        <div class="test-section">
            <h3>📊 Live DataTable</h3>
            <div class="alert alert-info">
                <strong>Note:</strong> This table will work only if you're logged in and have a program selected.
            </div>
            <table id="test-table" class="table table-striped">
                <thead>
                    <tr>
                        <th>Award</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Recipients</th>
                        <th>Progress</th>
                        <th>Certificate Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data loaded via AJAX -->
                </tbody>
            </table>
        </div>
        
        <div class="test-section">
            <h3>🔗 Quick Links</h3>
            <a href="/" class="btn btn-secondary">Admin Login</a>
            <a href="/welcome" class="btn btn-info">Select Program</a>
            <a href="/documents/certificates" class="btn btn-success">Certificate Management</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>

    <script>
        function testAjaxEndpoint() {
            const resultDiv = document.getElementById('ajax-result');
            resultDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div> Testing...';
            
            fetch('/documents/certificates/getData')
                .then(response => {
                    console.log('Response status:', response.status);
                    console.log('Response headers:', response.headers);
                    return response.text();
                })
                .then(data => {
                    console.log('Raw response:', data);
                    
                    try {
                        const jsonData = JSON.parse(data);
                        resultDiv.innerHTML = `
                            <div class="alert alert-success">
                                <strong>✅ Success!</strong><br>
                                Found ${jsonData.data ? jsonData.data.length : 'unknown'} awards
                            </div>
                            <pre class="bg-light p-3" style="max-height: 300px; overflow-y: auto;">${JSON.stringify(jsonData, null, 2)}</pre>
                        `;
                    } catch (e) {
                        resultDiv.innerHTML = `
                            <div class="alert alert-warning">
                                <strong>⚠️ Not JSON Response</strong><br>
                                This might be a login redirect or error page.
                            </div>
                            <div class="card">
                                <div class="card-header">Raw Response (first 1000 chars):</div>
                                <div class="card-body">
                                    <pre style="max-height: 200px; overflow-y: auto;">${data.substring(0, 1000)}</pre>
                                </div>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <strong>❌ Error:</strong> ${error.message}
                        </div>
                    `;
                });
        }
        
        // Initialize DataTable
        $(document).ready(function() {
            $('#test-table').DataTable({
                ajax: {
                    url: '/documents/certificates/getData',
                    type: 'GET',
                    success: function(data) {
                        console.log('DataTable success:', data);
                    },
                    error: function(xhr, error, thrown) {
                        console.error('DataTable error:', error);
                        console.error('Status:', xhr.status);
                        console.error('Response:', xhr.responseText);
                    }
                },
                columns: [
                    { data: 'title' },
                    { data: 'award_type' },
                    { data: 'description' },
                    { data: 'participants_count', className: 'text-center' },
                    { data: 'progress', orderable: false },
                    { data: 'certificate_status', className: 'text-center', orderable: false },
                    { data: 'actions', orderable: false, searchable: false, className: 'text-center' }
                ],
                order: [[0, 'asc']],
                pageLength: 10,
                language: {
                    emptyTable: "No awards found (may need authentication)"
                }
            });
        });
        
        // Placeholder functions for action buttons
        function viewAwardDetails(id) {
            alert('View Award Details: ' + id);
        }
        
        function manageParticipants(id) {
            alert('Manage Participants for Award: ' + id);
        }
        
        function issueCertificates(id) {
            alert('Issue Certificates for Award: ' + id);
        }
    </script>
</body>
</html>
