<!DOCTYPE html>
<html>
<head>
    <title>Certificate Debug - Direct Data Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Certificate Management - Direct Data Test</h2>
        <div class="card">
            <div class="card-body">
                <table id="certificates-table" class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Award Title</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Participants</th>
                            <th>Progress</th>
                            <th>Certificate Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>

    <script>
        $(document).ready(function() {
            console.log('🚀 Starting certificate debug test...');
            
            $('#certificates-table').DataTable({
                ajax: {
                    url: '/debug/certificates-direct',
                    type: 'GET',
                    dataSrc: function(json) {
                        console.log('📊 DataTable received:', json);
                        if (json.success && json.data) {
                            console.log('✅ Found', json.data.length, 'awards');
                            return json.data;
                        } else {
                            console.error('❌ No data or error:', json);
                            return [];
                        }
                    },
                    error: function(xhr, error, thrown) {
                        console.error('❌ AJAX Error:', {
                            status: xhr.status,
                            error: error,
                            response: xhr.responseText
                        });
                    }
                },
                columns: [
                    { data: 'title' },
                    { data: 'award_type' },
                    { data: 'description' },
                    { data: 'participants_count', className: 'text-center' },
                    { data: 'progress', orderable: false },
                    { data: 'certificate_status', className: 'text-center', orderable: false },
                    { data: 'actions', orderable: false, searchable: false, className: 'text-center' }
                ],
                order: [[0, 'asc']],
                pageLength: 10,
                language: {
                    emptyTable: "No awards found"
                }
            });
        });
    </script>
</body>
</html>
