<!DOCTYPE html>
<html>
<head>
    <title>Quick Admin Login - Certificate Management Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .login-card { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Admin Login - Certificate Test</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <strong>Instructions:</strong><br>
                    1. Login with admin credentials<br>
                    2. Select a program (Middle East Youth Summit 2025)<br>
                    3. Navigate to Documents → Certificates
                </div>
                
                <form action="/sign-in" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <small class="text-muted">
                        After login, visit: <br>
                        <a href="/welcome" target="_blank">/welcome</a> to select program<br>
                        Then: <a href="/documents/certificates" target="_blank">/documents/certificates</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
