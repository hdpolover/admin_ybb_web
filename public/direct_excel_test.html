<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Excel Export Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Direct Excel Export Test</h1>
        <p>This page allows you to test downloading Excel files without using AJAX.</p>
        
        <form action="/minimal-export/export-names" method="get">
            <div>
                <label for="program_id">Select Program:</label>
                <select id="program_id" name="program_id" required>
                    <option value="">-- Select a program --</option>
                    <option value="1">Program 1</option>
                    <option value="2">Program 2</option>
                    <option value="3">Program 3</option>
                </select>
            </div>
            
            <button type="submit" class="button">Download Excel</button>
        </form>
    </div>
</body>
</html>
