<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Export Polling</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 3px solid #007bff; }
        .error { border-left-color: #dc3545; }
        .success { border-left-color: #28a745; }
        button { padding: 10px 20px; margin: 10px 5px; }
    </style>
</head>
<body>
    <h1>Export Polling Debug Tool</h1>
    
    <div>
        <input type="text" id="exportId" placeholder="Enter Export ID (e.g., 04137220-add3-4a72-96aa-7f0603f1caa8)" style="width: 400px;">
        <button onclick="startPolling()">Start Polling</button>
        <button onclick="stopPolling()">Stop Polling</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="logs"></div>

    <script>
        let pollingInterval = null;
        let pollCount = 0;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            document.getElementById('logs').appendChild(logDiv);
            console.log(`[${timestamp}] ${message}`);
            
            // Auto scroll to bottom
            logDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function startPolling() {
            const exportId = document.getElementById('exportId').value.trim();
            if (!exportId) {
                log('Please enter an Export ID', 'error');
                return;
            }

            stopPolling(); // Stop any existing polling
            pollCount = 0;
            
            log(`Starting polling for export ID: ${exportId}`, 'info');

            pollingInterval = setInterval(async () => {
                pollCount++;
                log(`Poll #${pollCount} - Checking status...`, 'info');
                
                try {
                    const response = await $.ajax({
                        url: `/admin/exports/status/${exportId}`,
                        method: 'GET',
                        dataType: 'json',
                        timeout: 10000
                    });

                    log(`Response: ${JSON.stringify(response, null, 2)}`, 'info');
                    
                    if (response.success) {
                        log(`Status: ${response.status}`, 'info');
                        log(`Download URL: ${response.downloadUrl || 'None'}`, 'info');
                        
                        // Check completion conditions
                        const isCompleted = response.status === 'completed' || response.status === 'ready' || response.downloadUrl;
                        log(`Is completed? ${isCompleted}`, isCompleted ? 'success' : 'info');
                        
                        if (isCompleted) {
                            log('Export completed! Stopping polling...', 'success');
                            stopPolling();
                            return;
                        }
                    } else {
                        log(`Error response: ${response.message || 'Unknown error'}`, 'error');
                        stopPolling();
                    }
                } catch (error) {
                    log(`AJAX Error: ${error.responseText || error.message || 'Unknown error'}`, 'error');
                    if (pollCount >= 10) {
                        log('Too many errors, stopping polling', 'error');
                        stopPolling();
                    }
                }
            }, 3000); // Poll every 3 seconds

            log(`Polling started with interval ID: ${pollingInterval}`, 'success');
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                log(`Polling stopped. Interval ID was: ${pollingInterval}`, 'success');
                pollingInterval = null;
            } else {
                log('No active polling to stop', 'info');
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        // Auto-fill the export ID if there's one in the URL
        const urlParams = new URLSearchParams(window.location.search);
        const exportId = urlParams.get('exportId');
        if (exportId) {
            document.getElementById('exportId').value = exportId;
        }
    </script>
</body>
</html>
