<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Tell PHP it's HTTPS when Traefik terminates SSL upstream.
    # CI4's forceGlobalSecureRequests checks $_SERVER['HTTPS'].
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    # Pass real client IP from Traefik
    RemoteIPHeader X-Forwarded-For

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
